name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest

    services:
      # No MySQL needed – tests use SQLite :memory:
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, xml, ctype, json, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Copy .env for CI
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          echo "DB_DATABASE=:memory:" >> .env
        env:
          APP_KEY: base64:test_key_placeholder

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Pint (code style)
        run: vendor/bin/pint --test

      - name: Run Larastan (static analysis)
        run: vendor/bin/phpstan analyse --level=6 --no-progress

      - name: Run Pest (tests)
        run: php artisan test --env=testing

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Wayfinder generates @/routes and @/actions (gitignored) from the
      # Laravel routes, so the frontend checks and the build need PHP too
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, xml, ctype, json, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          echo "DB_DATABASE=:memory:" >> .env
          php artisan key:generate

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint 2>/dev/null || npx eslint resources/js --ext .ts,.tsx --max-warnings=0

      - name: Vitest (unit tests)
        run: npm run test 2>/dev/null || npx vitest run

      - name: Build assets
        run: npm run build
